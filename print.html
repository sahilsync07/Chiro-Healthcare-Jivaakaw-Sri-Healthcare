<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiro Healthcare — Forensic Ledger Printout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Styling for Print Preview / Screen view */
    :root {
      --primary-color: #000;
      --border-color: #000;
    }
    body {
      font-family: 'Inter', sans-serif;
      color: #000;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }
    .print-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto 30px auto;
      padding: 20mm;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
      position: relative;
    }
    .print-header {
      border-bottom: 2px solid #000;
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .print-header h1 {
      font-size: 20px;
      margin: 0;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .print-header .meta {
      font-size: 11px;
      text-align: right;
      line-height: 1.4;
    }
    .summary-title {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 15px;
      font-weight: 600;
      text-transform: uppercase;
      border-bottom: 1px solid #000;
      padding-bottom: 5px;
    }
    table.print-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 11px;
    }
    table.print-table th, table.print-table td {
      border: 1px solid #000;
      padding: 6px 8px;
      text-align: left;
      line-height: 1.3;
    }
    table.print-table th {
      background-color: #f3f4f6;
      font-weight: 600;
    }
    table.print-table td.amount {
      text-align: right;
      font-weight: 500;
    }
    table.print-table tr.total-row td {
      font-weight: 700;
      background-color: #f3f4f6;
    }
    .checksum-box {
      border: 1px dashed #000;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 11px;
      line-height: 1.5;
    }
    .checksum-box h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .verification-seal {
      font-weight: bold;
      color: #047857;
      text-transform: uppercase;
    }
    .print-footer {
      position: absolute;
      bottom: 20mm;
      left: 20mm;
      right: 20mm;
      border-top: 1px solid #000;
      padding-top: 8px;
      font-size: 9px;
      display: flex;
      justify-content: space-between;
    }
    .no-print-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #000;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .no-print-btn:hover {
      background: #333;
    }
    .no-print-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #fff;
      color: #000;
      border: 1px solid #000;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .back-btn:hover {
      background: #f3f4f6;
    }

    /* Print-specific style adjustments */
    @media print {
      body {
        background: #fff;
        padding: 0;
        margin: 0;
      }
      .no-print-btn, .back-btn {
        display: none !important;
      }
      .print-page {
        margin: 0;
        box-shadow: none;
        page-break-after: always;
        min-height: auto;
      }
      .print-page:last-child {
        page-break-after: avoid;
      }
    }
    @page {
      size: A4;
      margin: 0;
    }
  </style>
  <script type="module" crossorigin src="/Chiro-Healthcare-Jivaakaw-Sri-Healthcare/assets/print-BgiKz6KV.js"></script>

</head>

  </a>

  </button>

  <div id="print-container"></div>

</body>
</html>
